<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    
        <h1>Login</h1>
        <form action="/v/Login">
             <label for="name">Name : </label>
        <input  type="text" name="name" id="name" placeholder="Enter Name" required>
        <br><br>
        <label for="Email">Email : </label>
        <input type="email" name="email" id="email" placeholder="Enter Email" required>
        <br> <br>
        <label for="password">Password : </label>
        <input type="password" name="password" id="password" placeholder="Enter Password" required>
        <br><br>
        <label for="Confirm Password">Confirm Password : </label>
        <input type="password" name="confirm Password" id="ConfirmPassword" placeholder="Confirm Password" required>
        <br><br>
        <label for="genderData">Gender</label>
        <input type="text" id="GenderData" list="GenderOptions" placeholder="Type or select...">
        <datalist id="GenderOptions">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Transgender">Transgender</option>
        </datalist>
        </form>
       


</body>
</html>
